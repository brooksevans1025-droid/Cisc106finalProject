name: Deploy main branch as website

on:
  push:
    branches: [master]
  workflow_dispatch:  # adds the "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drafter
        run: pip install -r src/requirements.txt
      - name: Build the site
        working-directory: scripts
        run: drafter main.py --compile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/dist
      - id: deployment
        uses: actions/deploy-pages@v4
